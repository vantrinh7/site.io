
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Removes padding */
        body {
            margin: 0;
            padding: 0;
        }

        /* Forces image to cover the entire viewport */
        div {
            width: 100vw;
            height: 100vh;
        }

        /* Makes the image fluid and scale with the window */
        img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Image is not distored as window resizes */
            display: block;
        }

        /* Container covers the entire viewport */
        .image-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Top-left back arrow button */
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10; /* Ensures arrow stays on top of the image */
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background-color: rgba(150, 150, 150, 0.5); /* Semi-transparent overlay for visibility */
            color: #000000;
            text-decoration: none;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bolder;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .back-arrow:hover {
            background-color: rgba(150, 150, 150, 0.8);
            transform: scale(1.5);
        }
    </style>
</head>

<body>
    <div class="image-container">
        <!-- Back Arrow Link -->
        <a href="javascript:history.back()" class="back-arrow" aria-label="Back to home page">&#x25C4;</a>


        <img src="images/toberevealed.png">
    </div>
</body>

</html>
